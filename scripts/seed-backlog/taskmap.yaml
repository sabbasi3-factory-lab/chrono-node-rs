# Task map for core, English, German, French, Swedish, Portuguese, Spanish and Japanese (DESIGN §6). The owner approves this file; the seed script turns it
# into contracts/*.yaml deterministically. Change this file (by reviewed PR), never the contracts.
#
# Each task ports ONE upstream step into ONE Rust file (shared bases were ported by hand in
# Stage 0, so tasks don't share files). What the script derives instead of hard-coding:
#   - tier: from factory policies/tiers.yaml (pinned factory version) matched against `rust`
#   - depends_on: the cheapest golden case that needs this step decides which other unported
#     steps must land first, so the contract's golden gate can actually be met
#   - golden areas and priority: from tests/golden (areas where the step is required; more
#     golden cases = higher priority)
version: 1
upstream_root: upstream/src

# Ported by hand in Stage 0 (no contracts, no issues). Listed so the script can check that every
# step in every named configuration is either done or a task. The German, French and wave-1
# (sv, pt, es, ja) scaffolds (configuration, constants, DE extractTimeComponents) have no steps of their own.
done:
  - { step: ENCasualDateParser, rust: src/locales/en/parsers/casual_date.rs }
  - { step: ENWeekdayParser, rust: src/locales/en/parsers/weekday.rs }
  - { step: ENTimeExpressionParser, rust: src/locales/en/parsers/time_expression.rs }
  - { step: ENMergeDateTimeRefiner, rust: src/locales/en/refiners/merge_date_time.rs }
  - { step: ENMergeDateRangeRefiner, rust: src/locales/en/refiners/merge_date_range.rs }

tasks:
  # --- common parsers and refiners (src/common/**: auto-strict, human tier in Stage 1) ---
  - { id: common/iso-format-parser, step: ISOFormatParser, source: common/parsers/ISOFormatParser.ts, rust: src/common/parsers/iso_format.rs, area: common-parsers }
  - { id: common/slash-date-format-parser, step: SlashDateFormatParser, source: common/parsers/SlashDateFormatParser.ts, rust: src/common/parsers/slash_date_format.rs, area: common-parsers }
  - id: common/extract-timezone-abbr-refiner
    step: ExtractTimezoneAbbrRefiner
    source: common/refiners/ExtractTimezoneAbbrRefiner.ts
    rust: src/common/refiners/extract_timezone_abbr.rs
    area: common-refiners
    # Upstream never constructs it with a map, so no golden case covers the constructor; these
    # cases were produced by chrono-node v2.10.3 (TZ=UTC, the step swapped into the casual
    # English configuration, built with `constructor` and parsed with `option` timezones).
    unit:
      requirement: >-
        Keep upstream's optional constructor map (`timezoneOverrides`): expose a public constructor
        taking `Option<TimezoneAbbrMap>`, while `create(&Flags)` builds it with no map, as
        upstream's configuration does. Merge it with the per-parse `option.timezones` like
        `{ ...this.timezoneOverrides, ...context.option.timezones }`, so per-parse wins. Add one
        in-file `#[cfg(test)]` test per case, named the case's `test` (CI checks the names): build `create_casual_configuration(false)`, replace
        the refiner whose name is `UPSTREAM` with one built with `constructor`, parse `text` at
        `ref` with `option` as `timezones`, and assert the first result's text and
        `timezoneOffset` (null = not set).
      cases:
        - { test: no_map, text: "at 10:00 XYZ", ref: "2012-08-10T12:00:00Z", constructor: null, option: null, expect: { text: "at 10:00", timezoneOffset: null } }
        - { test: constructor_only, text: "at 10:00 XYZ", ref: "2012-08-10T12:00:00Z", constructor: { XYZ: -180 }, option: null, expect: { text: "at 10:00 XYZ", timezoneOffset: -180 } }
        - { test: per_parse_only, text: "at 10:00 XYZ", ref: "2012-08-10T12:00:00Z", constructor: null, option: { XYZ: 60 }, expect: { text: "at 10:00 XYZ", timezoneOffset: 60 } }
        - { test: per_parse_beats_constructor, text: "at 10:00 XYZ", ref: "2012-08-10T12:00:00Z", constructor: { XYZ: -180 }, option: { XYZ: 60 }, expect: { text: "at 10:00 XYZ", timezoneOffset: 60 } }
        - { test: constructor_beats_built_in, text: "at 10:00 EST", ref: "2012-08-10T12:00:00Z", constructor: { EST: 120 }, option: null, expect: { text: "at 10:00 EST", timezoneOffset: 120 } }
        - { test: per_parse_beats_constructor_and_built_in, text: "at 10:00 EST", ref: "2012-08-10T12:00:00Z", constructor: { EST: 120 }, option: { EST: -60 }, expect: { text: "at 10:00 EST", timezoneOffset: -60 } }
        - { test: merge_keeps_other_constructor_keys, text: "at 10:00 ABC", ref: "2012-08-10T12:00:00Z", constructor: { ABC: 30 }, option: { XYZ: 60 }, expect: { text: "at 10:00 ABC", timezoneOffset: 30 } }
  - { id: common/extract-timezone-offset-refiner, step: ExtractTimezoneOffsetRefiner, source: common/refiners/ExtractTimezoneOffsetRefiner.ts, rust: src/common/refiners/extract_timezone_offset.rs, area: common-refiners }
  - { id: common/forward-date-refiner, step: ForwardDateRefiner, source: common/refiners/ForwardDateRefiner.ts, rust: src/common/refiners/forward_date.rs, area: common-refiners }
  - { id: common/merge-weekday-component-refiner, step: MergeWeekdayComponentRefiner, source: common/refiners/MergeWeekdayComponentRefiner.ts, rust: src/common/refiners/merge_weekday_component.rs, area: common-refiners }
  - { id: common/overlap-removal-refiner, step: OverlapRemovalRefiner, source: common/refiners/OverlapRemovalRefiner.ts, rust: src/common/refiners/overlap_removal.rs, area: common-refiners }
  - { id: common/unlikely-format-filter, step: UnlikelyFormatFilter, source: common/refiners/UnlikelyFormatFilter.ts, rust: src/common/refiners/unlikely_format_filter.rs, area: common-refiners }

