# Task map for core, English, German and French (DESIGN §6). The owner approves this file; the seed script turns it
# into contracts/*.yaml deterministically. Change this file (by reviewed PR), never the contracts.
#
# Each task ports ONE upstream step into ONE Rust file (shared bases were ported by hand in
# Stage 0, so tasks don't share files). What the script derives instead of hard-coding:
#   - tier: from factory policies/tiers.yaml (pinned factory version) matched against `rust`
#   - depends_on: the cheapest golden case that needs this step decides which other unported
#     steps must land first, so the contract's golden gate can actually be met
#   - golden areas and priority: from tests/golden (areas where the step is required; more
#     golden cases = higher priority)
version: 1
upstream_root: upstream/src

# Ported by hand in Stage 0 (no contracts, no issues). Listed so the script can check that every
# step in every named configuration is either done or a task. The German and French Stage 0
# (configuration, constants, DE extractTimeComponents) has no steps of its own.
done:
  - { step: ENCasualDateParser, rust: src/locales/en/parsers/casual_date.rs }
  - { step: ENWeekdayParser, rust: src/locales/en/parsers/weekday.rs }
  - { step: ENTimeExpressionParser, rust: src/locales/en/parsers/time_expression.rs }
  - { step: ENMergeDateTimeRefiner, rust: src/locales/en/refiners/merge_date_time.rs }
  - { step: ENMergeDateRangeRefiner, rust: src/locales/en/refiners/merge_date_range.rs }

tasks:
  # --- common parsers and refiners (src/common/**: auto-strict, human tier in Stage 1) ---
  - { id: common/iso-format-parser, step: ISOFormatParser, source: common/parsers/ISOFormatParser.ts, rust: src/common/parsers/iso_format.rs, area: common-parsers }
  - { id: common/slash-date-format-parser, step: SlashDateFormatParser, source: common/parsers/SlashDateFormatParser.ts, rust: src/common/parsers/slash_date_format.rs, area: common-parsers }
  - id: common/extract-timezone-abbr-refiner
    step: ExtractTimezoneAbbrRefiner
    source: common/refiners/ExtractTimezoneAbbrRefiner.ts
    rust: src/common/refiners/extract_timezone_abbr.rs
    area: common-refiners
    # Upstream never constructs it with a map, so no golden case covers the constructor; these
    # cases were produced by chrono-node v2.10.3 (TZ=UTC, the step swapped into the casual
    # English configuration, built with `constructor` and parsed with `option` timezones).
    unit:
      requirement: >-
        Keep upstream's optional constructor map (`timezoneOverrides`): expose a public constructor
        taking `Option<TimezoneAbbrMap>`, while `create(&Flags)` builds it with no map, as
        upstream's configuration does. Merge it with the per-parse `option.timezones` like
        `{ ...this.timezoneOverrides, ...context.option.timezones }`, so per-parse wins. Add one
        in-file `#[cfg(test)]` test per case, named the case's `test` (CI checks the names): build `create_casual_configuration(false)`, replace
        the refiner whose name is `UPSTREAM` with one built with `constructor`, parse `text` at
        `ref` with `option` as `timezones`, and assert the first result's text and
        `timezoneOffset` (null = not set).
      cases:
        - { test: no_map, text: "at 10:00 XYZ", ref: "2012-08-10T12:00:00Z", constructor: null, option: null, expect: { text: "at 10:00", timezoneOffset: null } }
        - { test: constructor_only, text: "at 10:00 XYZ", ref: "2012-08-10T12:00:00Z", constructor: { XYZ: -180 }, option: null, expect: { text: "at 10:00 XYZ", timezoneOffset: -180 } }
        - { test: per_parse_only, text: "at 10:00 XYZ", ref: "2012-08-10T12:00:00Z", constructor: null, option: { XYZ: 60 }, expect: { text: "at 10:00 XYZ", timezoneOffset: 60 } }
        - { test: per_parse_beats_constructor, text: "at 10:00 XYZ", ref: "2012-08-10T12:00:00Z", constructor: { XYZ: -180 }, option: { XYZ: 60 }, expect: { text: "at 10:00 XYZ", timezoneOffset: 60 } }
        - { test: constructor_beats_built_in, text: "at 10:00 EST", ref: "2012-08-10T12:00:00Z", constructor: { EST: 120 }, option: null, expect: { text: "at 10:00 EST", timezoneOffset: 120 } }
        - { test: per_parse_beats_constructor_and_built_in, text: "at 10:00 EST", ref: "2012-08-10T12:00:00Z", constructor: { EST: 120 }, option: { EST: -60 }, expect: { text: "at 10:00 EST", timezoneOffset: -60 } }
        - { test: merge_keeps_other_constructor_keys, text: "at 10:00 ABC", ref: "2012-08-10T12:00:00Z", constructor: { ABC: 30 }, option: { XYZ: 60 }, expect: { text: "at 10:00 ABC", timezoneOffset: 30 } }
  - { id: common/extract-timezone-offset-refiner, step: ExtractTimezoneOffsetRefiner, source: common/refiners/ExtractTimezoneOffsetRefiner.ts, rust: src/common/refiners/extract_timezone_offset.rs, area: common-refiners }
  - { id: common/forward-date-refiner, step: ForwardDateRefiner, source: common/refiners/ForwardDateRefiner.ts, rust: src/common/refiners/forward_date.rs, area: common-refiners }
  - { id: common/merge-weekday-component-refiner, step: MergeWeekdayComponentRefiner, source: common/refiners/MergeWeekdayComponentRefiner.ts, rust: src/common/refiners/merge_weekday_component.rs, area: common-refiners }
  - { id: common/overlap-removal-refiner, step: OverlapRemovalRefiner, source: common/refiners/OverlapRemovalRefiner.ts, rust: src/common/refiners/overlap_removal.rs, area: common-refiners }
  - { id: common/unlikely-format-filter, step: UnlikelyFormatFilter, source: common/refiners/UnlikelyFormatFilter.ts, rust: src/common/refiners/unlikely_format_filter.rs, area: common-refiners }

  # --- English parsers (auto tier) ---
  - { id: en/casual-time-parser, step: ENCasualTimeParser, source: locales/en/parsers/ENCasualTimeParser.ts, rust: src/locales/en/parsers/casual_time.rs, area: en-casual }
  - { id: en/end-of-current-month-parser, step: ENEndOfCurrentMonthParser, source: locales/en/parsers/ENEndOfCurrentMonthParser.ts, rust: src/locales/en/parsers/end_of_current_month.rs, area: en-casual }
  - { id: en/month-name-parser, step: ENMonthNameParser, source: locales/en/parsers/ENMonthNameParser.ts, rust: src/locales/en/parsers/month_name.rs, area: en-month-names }
  - { id: en/month-name-little-endian-parser, step: ENMonthNameLittleEndianParser, source: locales/en/parsers/ENMonthNameLittleEndianParser.ts, rust: src/locales/en/parsers/month_name_little_endian.rs, area: en-month-names }
  - { id: en/month-name-middle-endian-parser, step: ENMonthNameMiddleEndianParser, source: locales/en/parsers/ENMonthNameMiddleEndianParser.ts, rust: src/locales/en/parsers/month_name_middle_endian.rs, area: en-month-names }
  - { id: en/year-month-name-parser, step: ENYearMonthNameParser, source: locales/en/parsers/ENYearMonthNameParser.ts, rust: src/locales/en/parsers/year_month_name.rs, area: en-month-names }
  - { id: en/year-month-day-parser, step: ENYearMonthDayParser, source: locales/en/parsers/ENYearMonthDayParser.ts, rust: src/locales/en/parsers/year_month_day.rs, area: en-numeric-dates }
  - { id: en/slash-month-format-parser, step: ENSlashMonthFormatParser, source: locales/en/parsers/ENSlashMonthFormatParser.ts, rust: src/locales/en/parsers/slash_month_format.rs, area: en-numeric-dates }
  - { id: en/relative-date-format-parser, step: ENRelativeDateFormatParser, source: locales/en/parsers/ENRelativeDateFormatParser.ts, rust: src/locales/en/parsers/relative_date_format.rs, area: en-relative }
  - { id: en/time-unit-ago-format-parser, step: ENTimeUnitAgoFormatParser, source: locales/en/parsers/ENTimeUnitAgoFormatParser.ts, rust: src/locales/en/parsers/time_unit_ago_format.rs, area: en-relative }
  - { id: en/time-unit-later-format-parser, step: ENTimeUnitLaterFormatParser, source: locales/en/parsers/ENTimeUnitLaterFormatParser.ts, rust: src/locales/en/parsers/time_unit_later_format.rs, area: en-relative }
  - { id: en/time-unit-within-format-parser, step: ENTimeUnitWithinFormatParser, source: locales/en/parsers/ENTimeUnitWithinFormatParser.ts, rust: src/locales/en/parsers/time_unit_within_format.rs, area: en-relative }
  - { id: en/time-unit-casual-relative-format-parser, step: ENTimeUnitCasualRelativeFormatParser, source: locales/en/parsers/ENTimeUnitCasualRelativeFormatParser.ts, rust: src/locales/en/parsers/time_unit_casual_relative_format.rs, area: en-relative }

  # --- English refiners (auto tier) ---
  - { id: en/end-of-period-refiner, step: ENEndOfPeriodRefiner, source: locales/en/refiners/ENEndOfPeriodRefiner.ts, rust: src/locales/en/refiners/end_of_period.rs, area: en-refiners }
  - { id: en/extract-year-suffix-refiner, step: ENExtractYearSuffixRefiner, source: locales/en/refiners/ENExtractYearSuffixRefiner.ts, rust: src/locales/en/refiners/extract_year_suffix.rs, area: en-refiners }
  - { id: en/merge-relative-after-date-refiner, step: ENMergeRelativeAfterDateRefiner, source: locales/en/refiners/ENMergeRelativeAfterDateRefiner.ts, rust: src/locales/en/refiners/merge_relative_after_date.rs, area: en-refiners }
  - { id: en/merge-relative-follow-by-date-refiner, step: ENMergeRelativeFollowByDateRefiner, source: locales/en/refiners/ENMergeRelativeFollowByDateRefiner.ts, rust: src/locales/en/refiners/merge_relative_follow_by_date.rs, area: en-refiners }
  - { id: en/unlikely-format-filter, step: ENUnlikelyFormatFilter, source: locales/en/refiners/ENUnlikelyFormatFilter.ts, rust: src/locales/en/refiners/unlikely_format_filter.rs, area: en-refiners }

  # `class`: the class the upstream file declares, where it differs from `step`. Both
  # `…TimeUnitRelativeFormatParser.ts` files declare a `…TimeUnitAgoFormatParser` class (French
  # already has a real one), so the step, the Rust `UPSTREAM` and the golden data use the file name.
  # --- German parsers and refiners (auto tier) ---
  - { id: de/casual-date-parser, step: DECasualDateParser, source: locales/de/parsers/DECasualDateParser.ts, rust: src/locales/de/parsers/casual_date.rs, area: de-casual }
  - { id: de/casual-time-parser, step: DECasualTimeParser, source: locales/de/parsers/DECasualTimeParser.ts, rust: src/locales/de/parsers/casual_time.rs, area: de-casual }
  - { id: de/time-expression-parser, step: DETimeExpressionParser, source: locales/de/parsers/DETimeExpressionParser.ts, rust: src/locales/de/parsers/time_expression.rs, area: de-time }
  - { id: de/specific-time-expression-parser, step: DESpecificTimeExpressionParser, source: locales/de/parsers/DESpecificTimeExpressionParser.ts, rust: src/locales/de/parsers/specific_time_expression.rs, area: de-time }
  - { id: de/month-name-little-endian-parser, step: DEMonthNameLittleEndianParser, source: locales/de/parsers/DEMonthNameLittleEndianParser.ts, rust: src/locales/de/parsers/month_name_little_endian.rs, area: de-dates }
  - { id: de/weekday-parser, step: DEWeekdayParser, source: locales/de/parsers/DEWeekdayParser.ts, rust: src/locales/de/parsers/weekday.rs, area: de-dates }
  - { id: de/time-unit-relative-format-parser, step: DETimeUnitRelativeFormatParser, source: locales/de/parsers/DETimeUnitRelativeFormatParser.ts, rust: src/locales/de/parsers/time_unit_relative_format.rs, area: de-relative, class: DETimeUnitAgoFormatParser }
  - { id: de/time-unit-within-format-parser, step: DETimeUnitWithinFormatParser, source: locales/de/parsers/DETimeUnitWithinFormatParser.ts, rust: src/locales/de/parsers/time_unit_within_format.rs, area: de-relative }
  - { id: de/merge-date-range-refiner, step: DEMergeDateRangeRefiner, source: locales/de/refiners/DEMergeDateRangeRefiner.ts, rust: src/locales/de/refiners/merge_date_range.rs, area: de-refiners }
  - { id: de/merge-date-time-refiner, step: DEMergeDateTimeRefiner, source: locales/de/refiners/DEMergeDateTimeRefiner.ts, rust: src/locales/de/refiners/merge_date_time.rs, area: de-refiners }

  # --- French parsers and refiners (auto tier) ---
  - { id: fr/casual-date-parser, step: FRCasualDateParser, source: locales/fr/parsers/FRCasualDateParser.ts, rust: src/locales/fr/parsers/casual_date.rs, area: fr-casual }
  - { id: fr/casual-time-parser, step: FRCasualTimeParser, source: locales/fr/parsers/FRCasualTimeParser.ts, rust: src/locales/fr/parsers/casual_time.rs, area: fr-casual }
  - { id: fr/time-expression-parser, step: FRTimeExpressionParser, source: locales/fr/parsers/FRTimeExpressionParser.ts, rust: src/locales/fr/parsers/time_expression.rs, area: fr-time }
  - { id: fr/specific-time-expression-parser, step: FRSpecificTimeExpressionParser, source: locales/fr/parsers/FRSpecificTimeExpressionParser.ts, rust: src/locales/fr/parsers/specific_time_expression.rs, area: fr-time }
  - { id: fr/month-name-little-endian-parser, step: FRMonthNameLittleEndianParser, source: locales/fr/parsers/FRMonthNameLittleEndianParser.ts, rust: src/locales/fr/parsers/month_name_little_endian.rs, area: fr-dates }
  - { id: fr/weekday-parser, step: FRWeekdayParser, source: locales/fr/parsers/FRWeekdayParser.ts, rust: src/locales/fr/parsers/weekday.rs, area: fr-dates }
  - { id: fr/time-unit-relative-format-parser, step: FRTimeUnitRelativeFormatParser, source: locales/fr/parsers/FRTimeUnitRelativeFormatParser.ts, rust: src/locales/fr/parsers/time_unit_relative_format.rs, area: fr-relative, class: FRTimeUnitAgoFormatParser }
  - { id: fr/time-unit-ago-format-parser, step: FRTimeUnitAgoFormatParser, source: locales/fr/parsers/FRTimeUnitAgoFormatParser.ts, rust: src/locales/fr/parsers/time_unit_ago_format.rs, area: fr-relative }
  - { id: fr/time-unit-within-format-parser, step: FRTimeUnitWithinFormatParser, source: locales/fr/parsers/FRTimeUnitWithinFormatParser.ts, rust: src/locales/fr/parsers/time_unit_within_format.rs, area: fr-relative }
  - { id: fr/merge-date-range-refiner, step: FRMergeDateRangeRefiner, source: locales/fr/refiners/FRMergeDateRangeRefiner.ts, rust: src/locales/fr/refiners/merge_date_range.rs, area: fr-refiners }
  - { id: fr/merge-date-time-refiner, step: FRMergeDateTimeRefiner, source: locales/fr/refiners/FRMergeDateTimeRefiner.ts, rust: src/locales/fr/refiners/merge_date_time.rs, area: fr-refiners }

# Acceptance defaults written into every contract.
acceptance:
