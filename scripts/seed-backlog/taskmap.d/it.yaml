    area: it-refiners
    unreachable: "It only drops a result whose text is \"secondo\" or ends with \"il secondo\" (not the whole text). A result's text ends with a parser match (merges append the later part), and no Italian pattern can end a match that way: every time-unit pattern needs a number before the unit (\"un secondo\") and no number or dictionary word ends in \"il\"; the patterns with an optional \"il\" put a modifier or a month after it (ITTimeUnitCasualRelativeFormatParser, ITRelativeDateFormatParser, ITMonthNameLittleEndianParser); and ITMonthNameMiddleEndianParser's ordinal follows a month, and no month ends in \"il\". The probe corpus below (every 1-3 token sequence of 33 tokens, alone and inside a sentence, both configs, with and without forwardDate: 296,472 traces) never reaches it."
    unit:
      requirement: "Port upstream `locales/it/refiners/ITUnlikelyFormatFilter.ts` into this one file, as PORTING.md says. No input reaches this step in the pinned chrono-node (`harness/onboard/hints.yaml`: It only drops a result whose text is \"secondo\" or ends with \"il secondo\" (not the whole text). A result's text ends with a parser match (merges append the later part), and no Italian pattern can end a match that way: every time-unit pattern needs a number before the unit (\"un secondo\") and no number or dictionary word ends in \"il\"; the patterns with an optional \"il\" put a modifier or a month after it (ITTimeUnitCasualRelativeFormatParser, ITRelativeDateFormatParser, ITMonthNameLittleEndianParser); and ITMonthNameMiddleEndianParser's ordinal follows a month, and no month ends in \"il\". The probe corpus below (every 1-3 token sequence of 33 tokens, alone and inside a sentence, both configs, with and without forwardDate: 296,472 traces) never reaches it.), so it has no golden case. Add one in-file `#[cfg(test)]` test per case, named the case's `test` (CI checks the names); the cases were recorded from the pinned chrono-node: `refine`: in a context for `text` with `reference` (and `options`), run this step alone on `input` (results serialized as in the golden files: `index` in UTF-16 code units, `known` components given, the rest implied) and the output must equal `expect.results`."
      cases:
        - test: drops_il_secondo_inside_longer_text
          kind: refine
          config: it.casual
          text: arrivo il secondo poi
          reference: 2024-03-06T12:00:00.000Z
          input:
            - index: 7
              text: il secondo
              start:
                known:
                  day: 2
                implied:
                  hour: 12
                  millisecond: 0
                  minute: 0
                  month: 3
                  second: 0
                  year: 2024
                date: 2024-03-02T12:00:00.000Z
                tags: []
              end: null
          expect:
            results: []
        - test: drops_bare_secondo_inside_longer_text
          kind: refine
          config: it.casual
          text: aspetta secondo me
          reference: 2024-03-06T12:00:00.000Z
          input:
            - index: 8
              text: secondo
              start:
                known:
                  day: 2
                implied:
                  hour: 12
                  millisecond: 0
                  minute: 0
                  month: 3
                  second: 0
                  year: 2024
                date: 2024-03-02T12:00:00.000Z
                tags: []
              end: null
          expect:
            results: []
        - test: keeps_a_result_that_is_the_whole_text
          kind: refine
          config: it.casual
          text: il secondo
          reference: 2024-03-06T12:00:00.000Z
          input:
