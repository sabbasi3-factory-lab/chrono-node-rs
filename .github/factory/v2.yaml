# Factory v2 (docs/factory-v2.md): one agent run and one PR per language, on platform features. Plain code
# reads this file (v2-router.yml, harness/gates, v2-port, v2-repair); nothing here is AI-decided.
# Human tier: changes need the owner's review.
version: 1
# Languages v2 ports. Each must also be in factory policies/onboarding.yaml `external_locales` at the
# pinned factory version (the router checks), so v1 never works on it. Pilot: Italian.
languages: [it]
# AI Credits for all v2 agent runs since `since` (every job: agent, threat detection, evals; from
# gh aw logs). The router starts a run only if the spend so far plus every AI job of that run at its
# cap fits (a port reserves 500 + 400 + 500, a repair 300 + 400). 2800 is one port and max_repairs
# repairs at their caps, so the worst case of one language is bounded. Pilot: the coordinator also
# stops and reports once measured spend passes 1000.
budget_aic: 2800
since: "2026-11-09"
# gh-aw max-ai-credits of each AI job (keep in step with the workflows' frontmatter; factory
# policies/budgets.yaml per_run.implement, per_run.repair, per_run.threat_detection). gh-aw v1.0.1's
# evals job (v2-port only) inherits the agent's cap; v2-port has had no evals since gh-aw v1.2.2
# (#564: uncapped), and its evals reservation stays (over-reserving only). A run still in progress counts at all of them.
caps:
  port: 500
  repair: 300
  threat_detection: 400
  evals: 500
# Repairs after the first run (factory policies/limits.yaml task.max_repairs); the same failure
# signature twice in a row also stops (stop_on_repeated_signature). Then needs-human.
max_repairs: 2
