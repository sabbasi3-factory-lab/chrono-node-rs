name: outcomes

# gh-aw Outcomes for every agent run (implement, repair, review), published as outcomes.json on the
# `outcomes` branch for the dashboard. Plain code, no AI. Two jobs so no write token sits next to a
# downloaded binary: `evaluate` runs gh-aw with a read-only token; `publish` only commits the file.
# Never checks out or runs PR code. See .github/factory/controller/README.md, "Outcomes".

on:
  pull_request_target:
    types: [closed] # merge-queue merges fire it too
    branches: [main]
  workflow_run:
    workflows: ["Implement one factory task", "Repair one factory PR", "Review one factory PR"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      full: { description: "Re-evaluate every run", type: boolean, default: false }

permissions: {}

concurrency:
  group: factory-outcomes
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      github.repository == 'sabbasi3-factory-lab/chrono-node-rs' &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.user.login == 'sabbasi3-factory-agent[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { actions: read, contents: read, pull-requests: read, issues: read }
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full && 'true' || 'false' }}
    steps:
      - name: Install gh-aw v0.92.0 (checksum pinned)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gh-aw" https://github.com/github/gh-aw/releases/download/v0.92.0/linux-amd64
          echo "4f1753b20416024b15ff2cbea3f5a8745d7473bd8c73d99b4e8a79d69bb0fe83  $RUNNER_TEMP/gh-aw" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/gh-aw"
      - name: Evaluate new and pending runs
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          G="$RUNNER_TEMP/gh-aw"; mkdir -p oc
          gh api "repos/$R/contents/outcomes.json?ref=outcomes" -H "Accept: application/vnd.github.raw" > prev.json 2>/dev/null || echo '{"runs":[]}' > prev.json
          "$G" logs implement repair review --repo "$R" --json -c 1000 --start-date 2026-10-01 -o logs > logs.json
          gh pr list --repo "$R" --state all --author app/sabbasi3-factory-agent -L 1000 --json number,title > prs.json
          # Evaluate runs not yet recorded, or still pending/unknown and under 14 days old (or all, if full).
          jq -r --slurpfile p prev.json --arg full "$FULL" --arg cut "$(date -u -d '-14 days' +%FT%TZ)" '
            ($p[0].runs | map({key: (.run_id|tostring), value: .}) | from_entries) as $prev
            | .runs[] | select(.status == "completed")
            | select($full == "true" or ($prev[(.run_id|tostring)] | . == null
                or (.created_at > $cut and any(.items[]; .outcome_status == "pending" or .outcome_status == "unknown"))))
            | .run_id' logs.json > todo.txt
          echo "evaluating $(wc -l < todo.txt) run(s)"
          xargs -r -P 4 -I{} sh -c 'timeout 180 "$0" outcomes {} --repo "$1" --json -o work > oc/{}.json 2>/dev/null || rm -f oc/{}.json' "$G" "$R" < todo.txt
          # One file: every run (fresh result, else the previous one), its task and the item outcomes.
          jq -n --slurpfile l logs.json --slurpfile p prev.json --slurpfile prs prs.json --argjson oc "$(jq -s 'map({key: (.run_id|tostring), value: .items}) | from_entries' oc/*.json 2>/dev/null || echo '{}')" '
            ($p[0].runs | map({key: (.run_id|tostring), value: .items}) | from_entries) as $prev
            | ($prs[0] | map({key: (.number|tostring), value: (.title | capture("^\\[factory\\] (?<t>[a-z0-9/_-]+):").t? // null)}) | from_entries) as $prtask
            | [$l[0].runs[] | select(.status == "completed") | (.run_id|tostring) as $id
                | (($oc[$id] // $prev[$id] // []) | map({type, object_url, outcome_status, zero_touch})) as $items
                | {run_id, workflow: (.workflow_path | capture("workflows/(?<w>[a-z]+)\\.").w), title: .display_title, created_at, aic,
                   task: ((.display_title | capture("^(Implement|Repair|Review) (?<t>[a-z0-9]+/[a-z0-9_-]+) ").t? )
                          // ([$items[].object_url // "" | capture("/pull/(?<n>[0-9]+)").n? | $prtask[.]] | map(select(.)) | first) // null),
                   items: $items}
                | .drill = ((.task // "") | startswith("drill/"))] as $runs
            | {generated_at: (now | todate), gh_aw_version: "v0.92.0", runs: $runs,
               summary: ([$runs[].items[].outcome_status] | group_by(.) | map({key: .[0], value: length}) | from_entries)}' > outcomes.json
          jq '.summary + {runs: (.runs | length)}' -c outcomes.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: outcomes, path: "${{ runner.temp }}/outcomes.json", retention-days: 7, if-no-files-found: error }

  publish:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: outcomes, path: new }
      - name: Commit outcomes.json to the outcomes branch (if changed)
        env: { GH_TOKEN: "${{ github.token }}", R: "${{ github.repository }}" }
        run: |
          set -euo pipefail
          jq -e '(.runs | type == "array") and all(.runs[]; (.run_id | type == "number") and (.items | type == "array"))' new/outcomes.json > /dev/null
          git init -q pub && cd pub
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            fetch -q --depth 1 "https://github.com/$R" outcomes 2>/dev/null && git checkout -q FETCH_HEAD || git checkout -q --orphan outcomes
          if [ -f outcomes.json ] && cmp -s <(jq -S 'del(.generated_at)' outcomes.json) <(jq -S 'del(.generated_at)' ../new/outcomes.json); then
            echo "unchanged"; exit 0
          fi
          cp ../new/outcomes.json . && git add outcomes.json
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "outcomes: $(jq -c .summary outcomes.json)"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push -q "https://github.com/$R" HEAD:refs/heads/outcomes
