name: outcomes

# gh-aw Outcomes for every agent run (implement, repair, review), published as outcomes.json on the
# `outcomes` branch for the dashboard. Plain code, no AI. Two jobs so no write token sits next to a
# downloaded binary: `evaluate` runs gh-aw with a read-only token; `publish` only commits the file.
# Never checks out or runs PR code. See .github/factory/controller/README.md, "Outcomes".

on:
  pull_request_target:
    types: [closed] # merge-queue merges fire it too
    branches: [main]
  workflow_run:
    workflows: ["Implement one factory task", "Repair one factory PR", "Review one factory PR"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  evaluate:
    if: >-
      github.repository == 'sabbasi3-factory-lab/chrono-node-rs' &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.user.login == 'sabbasi3-factory-agent[bot]')
    # Job-level (after the `if:`), so a skipped event never displaces a queued evaluation.
    concurrency: { group: factory-outcomes, cancel-in-progress: false }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { actions: read, contents: read, pull-requests: read, issues: read }
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      # gh-aw resolves workflow names from local .github/workflows; main's only, no credentials kept.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main, persist-credentials: false, sparse-checkout: .github/workflows }
      - name: Install gh-aw v1.0.1 (checksum pinned)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gh-aw" https://github.com/github/gh-aw/releases/download/v1.0.1/linux-amd64
          echo "746d0b41d5fb87e2c010b8ac23a464436bb745ff89fbd19a3456431942c37652  $RUNNER_TEMP/gh-aw" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/gh-aw"
      - name: Evaluate every run
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # Previous file: start empty only if the branch doesn't exist; any other read error fails the job.
          if gh api "repos/$R/branches" --paginate -q '.[].name' | grep -qx outcomes; then
            gh api "repos/$R/contents/outcomes.json?ref=outcomes" -H "Accept: application/vnd.github.raw" > prev.json
          else echo '{"runs":[]}' > prev.json; fi
          # Completed agent runs (plain API listing), then gh-aw v1's `logs --outcomes` (the `outcomes`
          # command is gone) once per run, 4 at a time: a malformed manifest aborts the whole call, so
          # one bad run must not block the rest. A failed call keeps that run's previous record; a run
          # gh-aw doesn't list (no artifacts, e.g. cancelled before the agent) is skipped, as before.
          for w in implement repair review; do
            gh api "repos/$R/actions/workflows/$w.lock.yml/runs?status=completed&created=>=2026-10-01&per_page=100" --paginate \
              -q '.workflow_runs[] | {run_id: .id, workflow: "'"$w"'", title: .display_title, created_at}'
          done | jq -s . > listed.json
          mkdir -p r && jq -r '.[].run_id' listed.json | (cd "$GITHUB_WORKSPACE" && xargs -r -n 1 -P 4 sh -c '
            out="$2/r/$3.json"
            timeout 300 "$0" logs implement repair review --repo "$1" --json -c 1 --start-date 2026-10-01 \
              --after-run-id $(($3 - 1)) --before-run-id $(($3 + 1)) --outcomes -o "$2/logs/$3" > "$out" 2>/dev/null &&
            jq -e --argjson id "$3" "(.runs // []) as \$r | (\$r | length == 0) or (\$r | length == 1 and .[0].run_id == \$id)" "$out" > /dev/null || rm -f "$out"' \
            "$RUNNER_TEMP/gh-aw" "$R" "$RUNNER_TEMP")
          echo "evaluated $(find r -name '*.json' | wc -l) of $(jq length listed.json) run(s)"
          if compgen -G 'r/*.json' > /dev/null; then
            jq -n 'reduce inputs as $x ({}; . + {(input_filename | capture("(?<id>[0-9]+)\\.json$").id): $x})' r/*.json > fresh.json
          else echo '{}' > fresh.json; fi
          gh pr list --repo "$R" --state all --author app/sabbasi3-factory-agent -L 1000 --json number,title > prs.json
          # One file: every listed run, plus previous runs no longer listed. A run whose evaluation failed
          # (call failed, eval_error, or an item-level `error`) keeps its previous items and is retried next time.
          jq -n --slurpfile l listed.json --slurpfile p prev.json --slurpfile prs prs.json --slurpfile f fresh.json '
            ($p[0].runs | map({key: (.run_id|tostring), value: .}) | from_entries) as $prev
            | ($prs[0] | map({key: (.number|tostring), value: (.title | capture("^\\[factory\\] (?<t>[a-z0-9/_-]+):").t? // null)}) | from_entries) as $prtask
            | [$l[0][] | (.run_id|tostring) as $id | $f[0][$id] as $new | $prev[$id] as $o
                | select($new == null or ($new.runs | length) == 1)
                | ($new.runs[0] // null) as $run | ($new.outcomes[0] // null) as $e
                | ($e != null and ($e.eval_error // null) == null and all($e.items[]; .outcome_status != "error")) as $ok
                | (if $ok then [$e.items[] | {type, object_url: ((.object_url // "") | if . == "" then null else . end), outcome_status, zero_touch: (.zero_touch // null)}]
                   else ($o.items // []) end) as $items
                | {run_id, workflow, title, created_at, aic: ($run.aic // $o.aic // null),
                   task: ((.title | capture("^(Implement|Repair|Review) (?<t>[a-z0-9]+/[a-z0-9_-]+) ").t? )
                          // ([$items[].object_url // "" | capture("/pull/(?<n>[0-9]+)").n? | $prtask[.]] | map(select(.)) | first) // null),
                   items: $items, eval_failed: (($ok | not) and ($o == null or ($o.eval_failed // false)))}
                | .drill = ((.task // "") | startswith("drill/"))] as $fresh
            | ($fresh | map(.run_id)) as $ids
            | ($fresh + [$p[0].runs[] | select(.run_id as $r | $ids | index($r) | not)]) as $runs
            | {generated_at: (now | todate), gh_aw_version: "v1.0.1", runs: $runs,
               summary: ([$runs[].items[].outcome_status] | group_by(.) | map({key: .[0], value: length}) | from_entries)}' > outcomes.json
          jq -c '.summary + {runs: (.runs | length), eval_failed: ([.runs[] | select(.eval_failed)] | length)}' outcomes.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: outcomes, path: "${{ runner.temp }}/outcomes.json", retention-days: 7, if-no-files-found: error }

  publish:
    needs: evaluate
    concurrency: { group: factory-outcomes-publish, cancel-in-progress: false }
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: outcomes, path: new }
      - name: Commit outcomes.json to the outcomes branch (if changed)
        env: { GH_TOKEN: "${{ github.token }}", R: "${{ github.repository }}" }
        run: |
          set -euo pipefail
          jq -e '(.runs | type == "array") and all(.runs[]; (.run_id | type == "number") and (.items | type == "array"))' new/outcomes.json > /dev/null
          git init -q pub && cd pub
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            fetch -q --depth 1 "https://github.com/$R" outcomes 2>/dev/null && git checkout -q FETCH_HEAD || git checkout -q --orphan outcomes
          if [ -f outcomes.json ] && cmp -s <(jq -S 'del(.generated_at)' outcomes.json) <(jq -S 'del(.generated_at)' ../new/outcomes.json); then
            echo "unchanged"; exit 0
          fi
          cp ../new/outcomes.json . && git add outcomes.json
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "outcomes: $(jq -c .summary outcomes.json)"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push -q "https://github.com/$R" HEAD:refs/heads/outcomes
