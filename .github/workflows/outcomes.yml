name: outcomes

# gh-aw Outcomes for every agent run (implement, repair, review, triage, and factory v2's v2-port and v2-repair), published as outcomes.json on the
# `outcomes` branch for the dashboard. Plain code, no AI. Two jobs so no write token sits next to a
# downloaded binary: `evaluate` runs gh-aw with a read-only token; `publish` only commits the file.
# Never checks out or runs PR code. See .github/factory/controller/README.md, "Outcomes".
#
# API budget: the repo's GITHUB_TOKEN allows 1,000 requests/h, shared with ci, gates, CodeQL and the
# gh-aw jobs. So events only *wake* it: an invocation within 14 minutes of the last evaluation
# stops after one request (the file read), and the next one picks the work up; each invocation
# evaluates at most 3 runs (.github/factory/outcomes/select.jq: closed PRs first, then new runs,
# then pending items re-checked at most once a day). Worst case about 4 × (8 + 3 × 16) ≈ 230/h.

on:
  pull_request_target:
    types: [closed] # merge-queue merges fire it too
    branches: [main]
  workflow_run:
    workflows: ["Implement one factory task", "Repair one factory PR", "Review one factory PR", "Pre-triage one needs-human factory task", "Port one language (factory v2)", "Repair one factory v2 PR"]
    types: [completed]
    branches: [main]
  # Picks up work events left behind (GitHub runs this late on the Free plan; that's fine here).
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      full: { description: "Re-evaluate every run", type: boolean, default: false }

permissions: {}

# The whole read → evaluate → publish lifecycle is serialized, so the next invocation reads the file
# (and its debounce clock) the previous one published. GitHub keeps one pending run and replaces
# older pending ones; nothing is lost: closed PRs are found by state, and cron wakes it again.
concurrency: { group: factory-outcomes, cancel-in-progress: false }

jobs:
  evaluate:
    if: >-
      github.repository == 'sabbasi3-factory-lab/chrono-node-rs' &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.user.login == 'sabbasi3-factory-agent[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { actions: read, contents: read, pull-requests: read, issues: read }
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full && 'true' || 'false' }}
      MANUAL: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      MAX_PER_RUN: "3"
    outputs:
      skip: ${{ steps.eval.outputs.skip }}
    steps:
      # gh-aw resolves workflow names from local .github/workflows; main's only, no credentials kept.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main, persist-credentials: false, sparse-checkout: .github }
      - name: Install gh-aw v1.0.1 (checksum pinned)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gh-aw" https://github.com/github/gh-aw/releases/download/v1.0.1/linux-amd64
          echo "746d0b41d5fb87e2c010b8ac23a464436bb745ff89fbd19a3456431942c37652  $RUNNER_TEMP/gh-aw" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/gh-aw"
      - name: Evaluate runs (at most MAX_PER_RUN)
        id: eval
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # Previous file: start empty only if it doesn't exist (404); any other read error fails the job.
          if ! gh api "repos/$R/contents/outcomes.json?ref=outcomes" -H "Accept: application/vnd.github.raw" > prev.json 2> err.txt; then
            grep -q "HTTP 404" err.txt || { cat err.txt; exit 1; }
            echo '{"runs":[]}' > prev.json
          fi
          # Debounce: evaluated within the last 14 minutes → stop here (one request spent).
          last=$(jq -r '.generated_at // "1970-01-01T00:00:00Z"' prev.json)
          if [ "$MANUAL" != true ] && [ "$(date -u -d '-14 minutes' +%FT%TZ)" \< "$last" ]; then
            echo "evaluated at ${last}: debounced"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Completed agent runs (plain API listing). Evaluate: new runs; failed, pending or unknown ones
          # under 14 days old; the closing PR's runs; all if `full`. gh-aw v1's `logs --outcomes` (the
          # `outcomes` command is gone) runs once per run, 4 at a time: a malformed manifest aborts the
          # whole call, so one bad run must not block the rest. A failed or unstarted call keeps that
          # run's previous record; a run gh-aw doesn't list (no artifacts,
          # e.g. cancelled early) is skipped, as before.
          for w in implement repair review triage v2-port v2-repair; do
            gh api "repos/$R/actions/workflows/$w.lock.yml/runs?status=completed&created=>=2026-10-01&per_page=100" --paginate \
              -q '.workflow_runs[] | {run_id: .id, workflow: "'"$w"'", title: .display_title, created_at}'
          done | jq -s . > listed.json
          gh pr list --repo "$R" --state all --author app/sabbasi3-factory-agent -L 1000 --json number,title,closedAt > prs.json
          NOW=$(date -u +%FT%TZ)
          echo "NOW=$NOW" >> "$GITHUB_ENV"
          jq -r -f "$GITHUB_WORKSPACE/.github/factory/outcomes/select.jq" --slurpfile p prev.json --slurpfile prs prs.json \
            --arg full "$FULL" --arg now "$NOW" --arg cut "$(date -u -d '-14 days' +%FT%TZ)" --arg day "$(date -u -d '-24 hours' +%FT%TZ)" \
            --arg max "$MAX_PER_RUN" listed.json > todo.txt
          echo "evaluating $(wc -l < todo.txt) of $(jq length listed.json) run(s)"
          # No new call starts after 15 minutes (each is capped at 5), so the job stays within its 30.
          mkdir -p r && export DEADLINE=$(( $(date +%s) + 900 )) && (cd "$GITHUB_WORKSPACE" && xargs -r -n 1 -P 4 sh -c '
            [ "$(date +%s)" -lt "$DEADLINE" ] || exit 0
            : > "$2/r/$3.started"
            out="$2/r/$3.json"
            for try in 1 2; do  # one retry: parallel calls occasionally fail transiently
              timeout 300 "$0" logs implement repair review triage v2-port v2-repair --repo "$1" --json -c 1 --start-date 2026-10-01 \
                --after-run-id $(($3 - 1)) --before-run-id $(($3 + 1)) --outcomes -o "$2/logs/$3-$try" > "$out" 2>/dev/null &&
              jq -e --argjson id "$3" "(.runs // []) as \$r | (\$r | length == 0) or (\$r | length == 1 and .[0].run_id == \$id)" "$out" > /dev/null &&
              exit 0
            done
            rm -f "$out"' \
            "$RUNNER_TEMP/gh-aw" "$R" "$RUNNER_TEMP" < "$RUNNER_TEMP/todo.txt")
          [ "$(date +%s)" -lt "$DEADLINE" ] || echo "::warning::outcome evaluation hit its 15-minute budget; unevaluated runs keep their previous records"
          echo "evaluated $(find r -name '*.json' | wc -l) of $(wc -l < todo.txt) run(s)"
          if compgen -G 'r/*.json' > /dev/null; then
            jq -n 'reduce inputs as $x ({}; . + {(input_filename | capture("(?<id>[0-9]+)\\.json$").id): $x})' r/*.json > fresh.json
          else echo '{}' > fresh.json; fi
          # One file: every listed run, plus previous runs no longer listed. A run whose evaluation failed
          # (call failed, eval_error, or an item-level `error`) keeps its previous items, is marked
          # eval_failed, and is retried while under 14 days old; an untried run keeps its old flag.
          find r -name '*.started' | sed -E 's|.*/([0-9]+)\.started$|\1|' | jq -R . | jq -s . > started.json
          jq -n --slurpfile l listed.json --slurpfile p prev.json --slurpfile prs prs.json --slurpfile f fresh.json --slurpfile s started.json --arg now "$NOW" '
            ($p[0].generated_at // "1970-01-01T00:00:00Z") as $gen
            | ($p[0].runs | map({key: (.run_id|tostring), value: .}) | from_entries) as $prev
            | ($prs[0] | map({key: (.number|tostring), value: (.title | capture("^\\[factory\\] (?<t>[a-z0-9/_-]+):").t? // null)}) | from_entries) as $prtask
            | ($s[0] | map({key: ., value: true}) | from_entries) as $tried
            | [$l[0][] | (.run_id|tostring) as $id | $f[0][$id] as $new | $prev[$id] as $o
                # Skip runs gh-aw does not list, and new runs never tried (deadline), so they stay new.
                # A tried run gh-aw lists no artifacts for (`runs: []`) is recorded too (no items, not
                # failed), so it is not "new" again on every invocation.
                | select(($new == null or ($new.runs | length) <= 1) and ($o != null or $tried[$id]))
                | ($new != null and ($new.runs | length) == 0) as $empty
                | ($new.runs[0] // null) as $run | ($new.outcomes[0] // null) as $e
                | ($empty or ($e != null and ($e.eval_error // null) == null and all($e.items[]; .outcome_status != "error"))) as $ok
                | (if $empty then ($o.items // [])
                   elif $ok then [$e.items[] | {type, object_url: ((.object_url // "") | if . == "" then null else . end), outcome_status, zero_touch: (.zero_touch // null)}]
                   else ($o.items // []) end) as $items
                | {run_id, workflow, title, created_at, aic: ($run.aic // $o.aic // null),
                   task: ((.title | capture("^(Implement|Repair|Review|Triage) (?<t>[a-z0-9-]+/[a-z0-9_-]+) ").t? )
                          // ([$items[].object_url // "" | capture("/pull/(?<n>[0-9]+)").n? | $prtask[.]] | map(select(.)) | first) // null),
                   items: $items, eval_failed: (if $ok then false elif $tried[$id] then true else ($o.eval_failed // false) end),
                   evaluated_at: (if $tried[$id] then $now else ($o.evaluated_at // $gen) end)}
                | .drill = ((.task // "") | startswith("drill/"))] as $fresh
            | ($fresh | map(.run_id)) as $ids
            | ($fresh + [$p[0].runs[] | select(.run_id as $r | $ids | index($r) | not)]) as $runs
            | {generated_at: $now, gh_aw_version: "v1.0.1", runs: $runs,
               summary: ([$runs[].items[].outcome_status] | group_by(.) | map({key: .[0], value: length}) | from_entries)}' > outcomes.json
          jq -c '.summary + {runs: (.runs | length), eval_failed: ([.runs[] | select(.eval_failed)] | length)}' outcomes.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.eval.outputs.skip != 'true'
        with: { name: outcomes, path: "${{ runner.temp }}/outcomes.json", retention-days: 7, if-no-files-found: error }

  publish:
    needs: evaluate
    if: needs.evaluate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: outcomes, path: new }
      - name: Commit outcomes.json to the outcomes branch
        env: { GH_TOKEN: "${{ github.token }}", R: "${{ github.repository }}" }
        run: |
          set -euo pipefail
          jq -e '(.runs | type == "array") and all(.runs[]; (.run_id | type == "number") and (.items | type == "array"))' new/outcomes.json > /dev/null
          git init -q pub && cd pub
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            fetch -q --depth 1 "https://github.com/$R" outcomes 2>/dev/null && git checkout -q FETCH_HEAD || git checkout -q --orphan outcomes
          # Always committed (also with no change): its generated_at is the debounce clock, so an
          # evaluation that found nothing to do still holds off the next one for 14 minutes.
          cp ../new/outcomes.json . && git add outcomes.json
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "outcomes: $(jq -c .summary outcomes.json)"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push -q "https://github.com/$R" HEAD:refs/heads/outcomes
