name: outcomes

# gh-aw Outcomes collector (plain code, no AI): evaluates every agent run of implement, repair and
# review with the pinned gh-aw's `outcomes` command and uploads one complete snapshot as the
# `outcomes` artifact. The controller (App token) ingests it into the audit log as an
# `outcomes_snapshot`; this job holds no App key and its token is read-only.
# Event-driven, with a daily sweep as the backstop (see .github/factory/controller/README.md, Outcomes):
# - pull_request_target closed (agent PRs only): that PR's outcome became final. Merge-queue merges
#   fire it too (verified: PR #149). PR code is never checked out or run, and no PR field but its
#   number reaches the script (through env).
# - workflow_run completed (implement, repair, review): that run's new outputs (pending at first).
# - schedule / workflow_dispatch (`full` re-evaluates everything): pending/unknown and recent runs,
#   and the full backfill when there's no previous snapshot.

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_run:
    workflows: ["Implement one factory task", "Repair one factory PR", "Review one factory PR"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-evaluate every agent run (full backfill)"
        type: boolean
        required: false
        default: false

permissions: {}

# Bursts queue rather than race. GitHub keeps one pending run per group (a newer one replaces it);
# a targeted run also re-evaluates every recent run still pending or unknown, so nothing is lost.
concurrency:
  group: factory-outcomes
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.repository == 'sabbasi3-factory-lab/chrono-node-rs' &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.user.login == 'sabbasi3-factory-agent[bot]') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: read
    defaults:
      run:
        working-directory: .github/factory/controller
    steps:
      - name: Check out main (never PR code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/factory/controller/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Pinned gh-aw release binary, verified against the v0.92.0 release checksums.txt entry for
      # linux-amd64 (never `curl | sh`, never an unpinned extension install).
      - name: Install gh-aw v0.92.0 (checksum pinned)
        env:
          GH_AW_URL: https://github.com/github/gh-aw/releases/download/v0.92.0/linux-amd64
          GH_AW_SHA256: 4f1753b20416024b15ff2cbea3f5a8745d7473bd8c73d99b4e8a79d69bb0fe83
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gh-aw" "$GH_AW_URL"
          echo "$GH_AW_SHA256  $RUNNER_TEMP/gh-aw" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/gh-aw"
          "$RUNNER_TEMP/gh-aw" version

      - name: Collect outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_AW_BIN: ${{ runner.temp }}/gh-aw
          OUTCOMES_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full && 'true' || 'false' }}
          # Numbers only; the script reads everything else about the PR through the API.
          OUTCOMES_PR: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || '' }}
          OUTCOMES_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: node collect-outcomes.ts --out "$RUNNER_TEMP/outcomes/outcomes.json" --work "$RUNNER_TEMP/gh-aw-work" --concurrency 4 --timeout 180

      - name: Upload outcomes artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: outcomes
          path: ${{ runner.temp }}/outcomes/outcomes.json
          retention-days: 7
          if-no-files-found: error
