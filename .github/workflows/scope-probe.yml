name: scope-probe

# Throwaway runtime check (never merged): which repos can the controller App's
# installation token reach? Prints only HTTP status codes and repository names.
on:
  pull_request:
    paths: [".github/workflows/scope-probe.yml"]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No `repositories:` input: the token covers every repo the installation can see.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.FACTORY_CONTROLLER_APP_ID }}
          private-key: ${{ secrets.FACTORY_CONTROLLER_PRIVATE_KEY }}
          owner: sabbasi3-factory-lab
      - name: Probe
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          echo "installation repositories:"
          gh api installation/repositories --jq '.total_count, (.repositories[].full_name)'
          for r in chrono-node-rs factory factory-ops; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/sabbasi3-factory-lab/$r/issues?per_page=1&state=all")
            echo "GET $r/issues -> $code"
          done
          # A write on factory with an invalid colour: 403/404 = no access; 422 = access (and still no side effect).
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -d '{"name":"scope-probe","color":"zz"}' https://api.github.com/repos/sabbasi3-factory-lab/factory/labels)
          echo "POST factory/labels (invalid colour) -> $code"
