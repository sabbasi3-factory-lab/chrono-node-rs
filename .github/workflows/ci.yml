# Build-and-test gates for every PR and every merge-queue entry (DESIGN §9). This job runs the
# candidate's own code, so it references no secrets and holds only a read-only token. Policy gates
# (scope, contract SHA, cargo deny, identifiers) run from trusted base code in gates.yml.
# Together: 2 jobs per PR (factory policies/limits.yaml ci.max_jobs_per_pr).
# Human tier: changes need the owner's review.
name: ci

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Trusted: the first step, before any PR code exists on the runner (even before checkout).
      # It commits to a fresh held-out seed by printing only sha256("<salt>:<seed>"). The seed and
      # salt go to private files, which later steps read into non-exported shell variables, so
      # they never appear in a step header or a child process environment before the reveal
      # after the run. The controller records a seed only if the reveal matches this single
      # commitment, and only when the change leaves .github/ alone (DESIGN §9, §11). It proves which
      # seed was generated, not that PR code used it honestly; PR code on the same runner could
      # still read the files. This guards the record, not secrecy from the build.
      - name: Held-out seed commitment (trusted, before any PR code)
        run: |
          dir="$RUNNER_TEMP/factory-heldout"
          mkdir -p -m 700 "$dir"
          umask 077
          seed=$(od -An -N4 -tu4 /dev/urandom | tr -d ' \n')
          salt=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          printf '%s' "$seed" > "$dir/seed"
          printf '%s' "$salt" > "$dir/salt"
          commit=$(printf '%s:%s' "$salt" "$seed" | sha256sum | cut -d' ' -f1)
          echo "factory-heldout-commit: $commit"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: harness/package-lock.json

      - name: Install harness dependencies
        working-directory: harness
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Gate tests (scope logic)
        working-directory: harness
        run: npm run test:gates

      - name: Contract acceptance for the test steps (enforced in gates.yml)
        id: scope
        working-directory: harness
        env:
          GATE_MODE: outputs
          GH_TOKEN: ${{ github.token }}
        run: node gates/scope-check.js

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo build
        run: cargo build --all-targets --locked

      - name: Unit tests and configuration order
        run: cargo test --locked --lib --bins --test configurations

      - name: Whole-crate golden suite (no regressions)
        run: cargo test --locked --test golden -- --nocapture

      - name: Contract golden cases (all ported cases pass; the new step is exercised)
        if: steps.scope.outputs.golden_areas != ''
        env:
          GOLDEN_AREAS: ${{ steps.scope.outputs.golden_areas }}
          GOLDEN_REQUIRE_STEP: ${{ steps.scope.outputs.golden_step }}
        run: cargo test --locked --test golden -- --nocapture

      - name: Doc tests
        run: cargo test --locked --doc

      - name: Golden data matches upstream/ and harness/
        working-directory: harness
        run: npm run golden:check

      - name: Build chrono-node from upstream/
        working-directory: harness
        run: npm run build:upstream

      - name: Comparison with chrono-node (contract seed, reproducible)
        working-directory: harness
        env:
          SEED: ${{ steps.scope.outputs.differential_seed }}
          PHRASES: ${{ steps.scope.outputs.differential_phrases }}
        run: node compare/compare.js --seed "$SEED" --phrases "$PHRASES" --rust ../target/debug/chrono-rs-json

      - name: Held-out comparison with chrono-node (fresh seed from the first step)
        working-directory: harness
        run: |
          seed=$(cat "$RUNNER_TEMP/factory-heldout/seed")
          node compare/compare.js --seed "$seed" --phrases 2000 --rust ../target/debug/chrono-rs-json

      # After the run (even if it failed): reveal the seed and salt for the commitment above.
      - name: Reveal the held-out seed
        if: always()
        run: |
          echo "factory-heldout-seed: $(cat "$RUNNER_TEMP/factory-heldout/seed")"
          echo "factory-heldout-salt: $(cat "$RUNNER_TEMP/factory-heldout/salt")"
