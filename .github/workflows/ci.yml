# Build-and-test gates for every PR and every merge-queue entry (DESIGN §9). This job runs the
# candidate's own code, so it references no secrets and holds only a read-only token. Policy gates
# (scope, contract SHA, cargo deny, identifiers) run from trusted base code in gates.yml.
# Together: 2 jobs per PR (factory policies/limits.yaml ci.max_jobs_per_pr).
# Human tier: changes need the owner's review.
name: ci

on:
  pull_request:
  merge_group:
  # Post-merge check of every commit on main: a failure on an auto-strict merge commit makes the
  # controller open and queue a revert (auto-revert, DESIGN §9).
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# One group per PR, per merge-group ref, and per main commit (a post-merge run is never cancelled
# or replaced by the next push).
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90  # auto-strict factory PRs add the strict gates (mutation testing is capped at 2 x 20 min)
    steps:
      # Trusted: the first step, before any PR code exists on the runner (even before checkout).
      # It commits to a fresh held-out seed by printing only sha256("<salt>:<seed>"). The seed and
      # salt go to private files, which later steps read into non-exported shell variables, so
      # they never appear in a step header or a child process environment before the reveal
      # after the run. The controller records a seed only if the reveal matches this single
      # commitment, and only when the change leaves .github/ alone (DESIGN §9, §11). It proves which
      # seed was generated, not that PR code used it honestly; PR code on the same runner could
      # still read the files. This guards the record, not secrecy from the build.
      - name: Held-out seed commitment (trusted, before any PR code)
        run: |
          dir="$RUNNER_TEMP/factory-heldout"
          mkdir -p -m 700 "$dir"
          umask 077
          seed=$(od -An -N4 -tu4 /dev/urandom | tr -d ' \n')
          salt=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          printf '%s' "$seed" > "$dir/seed"
          printf '%s' "$salt" > "$dir/salt"
          commit=$(printf '%s:%s' "$salt" "$seed" | sha256sum | cut -d' ' -f1)
          echo "factory-heldout-commit: $commit"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: harness/package-lock.json

      - name: Install harness dependencies
        working-directory: harness
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The candidate's labels.json must be one labels-sync.yml can apply on merge (GitHub's label limits).
      - name: Factory labels are valid (labels.json)
        run: |
          jq -e '.labels | type == "array" and length > 0
            and all(.[]; (.name | type == "string" and length > 0 and length <= 50) and (.color | type == "string" and test("^[0-9A-Fa-f]{6}$")) and ((.description // "") | type == "string" and length <= 100))
            and (map(.name) | length == (unique | length))' .github/factory/labels.json > /dev/null \
            || { echo "::error file=.github/factory/labels.json::every label needs a unique name (≤ 50), a 6-hex colour and a description ≤ 100 characters"; exit 1; }

      # gh-aw refuses to activate a workflow whose lock's frontmatter hash doesn't match its .md
      # (E009 CONFIG_HASH_MISMATCH): #393's reviewer failed that way. Recompile the factory's agentic
      # workflows with the pinned gh-aw (no token, no network beyond this download) and require no
      # change. (queue-probe/queue-dispatch are experiments compiled with another gh-aw build: #353.)
      - name: Agentic workflow locks match their sources (gh aw compile, pinned v1.0.1)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gh-aw" https://github.com/github/gh-aw/releases/download/v1.0.1/linux-amd64
          echo "746d0b41d5fb87e2c010b8ac23a464436bb745ff89fbd19a3456431942c37652  $RUNNER_TEMP/gh-aw" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/gh-aw"
          env -u GH_TOKEN -u GITHUB_TOKEN "$RUNNER_TEMP/gh-aw" compile implement repair review triage improve
          git diff --exit-code --stat -- .github/workflows .github/aw \
            || { echo "::error::a .lock.yml is stale: run 'gh aw compile <name>' with gh-aw v1.0.1 and commit the result"; exit 1; }
          [ -z "$(git status --porcelain --untracked-files=all -- .github)" ] || { git status --short -- .github; echo "::error::gh aw compile wrote unexpected files"; exit 1; }

      - name: Gate and feedback tests (scope logic, monitor and intake)
        working-directory: harness
        run: npm run test:gates

      - name: Contract acceptance for the test steps (enforced in gates.yml)
        id: scope
        working-directory: harness
        env:
          GATE_MODE: outputs
          GH_TOKEN: ${{ github.token }}
        run: node gates/scope-check.js

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo build
        run: cargo build --all-targets --locked

      - name: Unit tests and configuration order
        run: cargo test --locked --lib --bins --test configurations

      - name: Whole-crate golden suite (no regressions)
        run: cargo test --locked --test golden -- --nocapture

      - name: Contract golden cases (all ported cases pass; the new step is exercised)
        if: steps.scope.outputs.golden_areas != ''
        env:
          GOLDEN_AREAS: ${{ steps.scope.outputs.golden_areas }}
          GOLDEN_REQUIRE_STEP: ${{ steps.scope.outputs.golden_step }}
        run: cargo test --locked --test golden -- --nocapture

      - name: Doc tests
        run: cargo test --locked --doc

      - name: Golden data matches upstream/ and harness/
        working-directory: harness
        run: npm run golden:check

      # A bug-intake fix PR is queued without the owner only when this and golden:check pass: the
      # fix case is chrono-node's own output (regenerated byte for byte from its request) and every
      # contract, its new fix contract included, is exactly what the seed script generates.
      - name: Contracts match the seed script (bug-intake fix PRs)
        if: steps.scope.outputs.intake == 'true'
        working-directory: scripts/seed-backlog
        run: npm ci --ignore-scripts --no-audit --no-fund && node seed.js contracts --check

      - name: Build chrono-node from upstream/
        working-directory: harness
        run: npm run build:upstream

      # Generated locales (harness/onboard/onboard.js): their scaffold, task map fragment and coverage
      # requests re-render byte for byte from upstream/ and tests/golden/ (golden:check above covers
      # the golden files).
      - name: Generated locales match the onboarding generator
        working-directory: harness
        run: node onboard/onboard.js check

      # Per-step check of every golden case, pending ones included (golden/frontier.js): each ported
      # step's own output must match chrono-node's, so a step can't merge with a defect that only a
      # still-pending case exposes (#397), and a failure names the step and task to blame. The
      # completion part: a generated language whose task steps are all ported has no pending case.
      - name: Golden frontier (every ported step on every case; finished languages have no pending case)
        working-directory: harness
        env:
          TZ: UTC
        run: node golden/frontier.js --rust ../target/debug/chrono-rs-json --complete | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash -eo pipefail {0}

      # The skeleton drill: onboard every candidate language in a throwaway copy and fail if a
      # contract scope file's directory isn't generated (agents can't mkdir). Only when the PR
      # changes what onboarding is generated from; about 10 s per language.
      - name: Onboarding skeleton drill (every candidate language)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(harness/(onboard|golden|lib)/|scripts/seed-backlog/|upstream/|build\.rs$|\.github/workflows/onboard\.yml$)'; then
            (cd scripts/seed-backlog && npm ci --ignore-scripts --no-audit --no-fund)
            (cd harness && node onboard/onboard.js drill)
          else
            echo "no onboarding input changed; skipped"
          fi

      # An onboarding PR also adds contracts: they must be exactly the seed script's output. Only on
      # those PRs, so a factory pin bump that changes a tier can't turn every PR red.
      - name: Onboarding PR contracts match the seed script
        if: startsWith(github.head_ref, 'factory/onboard/')
        working-directory: scripts/seed-backlog
        run: npm ci --ignore-scripts --no-audit --no-fund && node seed.js contracts --check

      - name: Comparison with chrono-node (contract seed, reproducible)
        working-directory: harness
        env:
          SEED: ${{ steps.scope.outputs.differential_seed }}
          PHRASES: ${{ steps.scope.outputs.differential_phrases }}
        run: node compare/compare.js --seed "$SEED" --phrases "$PHRASES" --rust ../target/debug/chrono-rs-json

      - name: Held-out comparison with chrono-node (fresh seed from the first step)
        working-directory: harness
        run: |
          seed=$(cat "$RUNNER_TEMP/factory-heldout/seed")
          node compare/compare.js --seed "$seed" --phrases 2000 --rust ../target/debug/chrono-rs-json

      # Auto-strict (core, common, calculation, dependencies, or a contract with tier auto-strict):
      # the full regression. The whole-crate golden suite above already checks every ported case
      # in every configuration; this adds a 10,000-phrase held-out comparison with the same trusted
      # fresh seed. The controller reads this step's result from the jobs API (runner metadata, not
      # log text) and won't enqueue an auto-strict PR unless it succeeded. Keep the name exact.
      - name: Full regression (auto-strict) - held-out comparison, 10000 phrases
        if: steps.scope.outputs.strict == 'true'
        working-directory: harness
        run: |
          seed=$(cat "$RUNNER_TEMP/factory-heldout/seed")
          node compare/compare.js --seed "$seed" --phrases 10000 --rust ../target/debug/chrono-rs-json

      # After the run (even if it failed): reveal the seed and salt for the commitment above.
      # Strict gates (tiers.yaml auto-strict.strict_gates), auto-strict changes only. Each runs in this
      # job with exactly the full regression's `if:` and never continue-on-error, so a green `ci`
      # whose full-regression step succeeded also ran and passed every one of them (the controller
      # checks that step; test/strict-gates.test.ts checks this file's shape).
      - name: Strict gate tools - cargo-semver-checks
        if: steps.scope.outputs.strict == 'true'
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-semver-checks@0.51.0

      - name: Strict gate - semver_checks (no public API break)
        if: steps.scope.outputs.strict == 'true'
        env:
          # The base this change applies to: the PR's base, the queue's base, or main before the push.
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          KIND: ${{ steps.scope.outputs.kind }}
        run: |
          [[ "$BASE_REV" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::semver_checks: no base revision"; exit 1; }
          # Additions are fine; removals and incompatible changes fail (contracts: public_api: unchanged-except-added).
          # Enforced on factory PRs (what auto-strict merges); advisory on a person's PRs and on main,
          # where the owner decides.
          # The baseline checkout under target/ would trip rust-cache's post-job cleanup: remove it.
          trap 'rm -rf target/semver-checks' EXIT
          if [ "$KIND" = "factory" ]; then
            cargo semver-checks check-release --baseline-rev "$BASE_REV" --release-type patch
          else
            cargo semver-checks check-release --baseline-rev "$BASE_REV" --release-type patch || echo "::warning::semver_checks: public API break (advisory: not a factory PR)"
          fi

      - name: Strict gate tools - cargo-mutants
        if: steps.scope.outputs.strict == 'true'
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-mutants@27.1.0

      - name: Strict gate - mutation_score_not_lower (changed code, cargo-mutants)
        if: steps.scope.outputs.strict == 'true'
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          KIND: ${{ steps.scope.outputs.kind }}
          EVENT: ${{ github.event_name }}
          CAP_SECONDS: "1200"   # per cargo-mutants run (head, then base); the cap fails closed
          # The floor for new code is policy: tiers.yaml strict_gates_params (pinned factory version).
        # Enforced when "$KIND" = "factory" on pull requests (see the script).
        run: bash harness/strict/mutation.sh

      - name: Strict gate - perf_regression_max_pct (golden phrases bench, criterion)
        if: steps.scope.outputs.strict == 'true'
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          KIND: ${{ steps.scope.outputs.kind }}
          EVENT: ${{ github.event_name }}
          MAX_PCT: "5"   # tiers.yaml perf_regression_max_pct
        # Enforced when "$KIND" = "factory" on pull requests (see the script).
        run: bash harness/strict/perf.sh

      - name: Strict gate - code_health_not_worse (clippy complexity lints)
        if: steps.scope.outputs.strict == 'true'
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          KIND: ${{ steps.scope.outputs.kind }}
          EVENT: ${{ github.event_name }}
        # Enforced when "$KIND" = "factory" on pull requests (see the script).
        run: bash harness/strict/code-health.sh

      - name: Reveal the held-out seed
        if: always()
        run: |
          echo "factory-heldout-seed: $(cat "$RUNNER_TEMP/factory-heldout/seed")"
          echo "factory-heldout-salt: $(cat "$RUNNER_TEMP/factory-heldout/salt")"
