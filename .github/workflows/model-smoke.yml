# Model smoke test (DESIGN §8, Stage 0): which models can this Copilot seat actually use?
# Manual only. Lists the models the seat sees, then sends each candidate a one-word prompt with
# the same Copilot CLI version gh-aw v0.92.0 pins (1.0.96). Costs one small request per model.
# Human tier: changes need the owner's review.
name: model-smoke

on:
  workflow_dispatch:
    inputs:
      candidates:
        description: "Comma-separated model ids to try (blank = every chat model the seat lists)"
        required: false
        default: ""
      max:
        description: "Try at most this many models"
        required: false
        default: "40"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COPILOT_CLI_VERSION: "1.0.96"
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: List models visible to the seat
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -o pipefail
          code=$(curl -sS -o models.json -w '%{http_code}' \
            -H "Authorization: Bearer ${COPILOT_GITHUB_TOKEN}" \
            -H "Copilot-Integration-Id: copilot-developer-cli" \
            https://api.githubcopilot.com/models || echo "000")
          echo "models endpoint: HTTP ${code}"
          if [ "${code}" = "200" ]; then
            jq -r '.data[] | [.id, (.vendor // ""), (.capabilities.type // ""), ((.model_picker_enabled // false) | tostring), (.policy.state // "")] | @tsv' models.json \
              | sort > models.tsv
            echo "listed $(wc -l < models.tsv) models"
          else
            : > models.tsv
            echo "::warning::could not list models (HTTP ${code}); falling back to the candidates input"
          fi

      - name: Choose candidates
        env:
          CANDIDATES: ${{ inputs.candidates }}
          MAX: ${{ inputs.max }}
        run: |
          if [ -n "${CANDIDATES}" ]; then
            echo "${CANDIDATES}" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' > candidates.txt
          else
            awk -F'\t' '$3 == "chat" && $5 != "disabled" { print $1 }' models.tsv > candidates.txt
          fi
          head -n "${MAX}" candidates.txt > c && mv c candidates.txt
          echo "trying $(wc -l < candidates.txt) models"
          test -s candidates.txt

      - name: Install Copilot CLI
        run: npm install -g "@github/copilot@${COPILOT_CLI_VERSION}" && copilot --version

      - name: Try each candidate
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          : > results.tsv
          while read -r model; do
            start=$(date +%s)
            if timeout 180 copilot --model "${model}" --prompt "Reply with exactly the word OK and nothing else." > out.txt 2> err.txt < /dev/null; then rc=0; else rc=$?; fi
            secs=$(( $(date +%s) - start ))
            if [ "${rc}" = "0" ] && grep -qw "OK" out.txt; then result=ok; else result=fail; fi
            # Keep only a short, single-line error reason (no prompt or output text).
            reason=$(tr '\n' ' ' < err.txt | grep -oiE "(not (available|supported|enabled)|unknown model|forbidden|unauthori[sz]ed|quota|rate limit|policy)[^.]{0,60}" | head -1)
            printf '%s\t%s\t%s\t%s\t%s\n' "${model}" "${result}" "${rc}" "${secs}" "${reason}" | tee -a results.tsv
          done < candidates.txt

      - name: Report
        if: always()
        run: |
          {
            echo "## Model smoke test (Copilot CLI ${COPILOT_CLI_VERSION})"
            echo
            echo "| model | result | exit | seconds | reason |"
            echo "|---|---|---|---|---|"
            awk -F'\t' '{ printf "| `%s` | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5 }' results.tsv 2>/dev/null
            echo
            echo "<details><summary>Models listed for the seat (id, vendor, type, picker, policy)</summary>"
            echo
            echo '```'
            cat models.tsv 2>/dev/null
            echo '```'
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"
          jq -Rn '[inputs | split("\t") | {model: .[0], result: .[1], exit: (.[2]|tonumber), seconds: (.[3]|tonumber), reason: .[4]}]' results.tsv > results.json 2>/dev/null || echo '[]' > results.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: model-smoke
          path: |
            results.json
            models.tsv
          retention-days: 30
