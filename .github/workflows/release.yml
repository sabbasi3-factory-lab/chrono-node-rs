# Release (DESIGN §10). Plain code, no AI. Started by hand; nothing ships without the owner.
#
#   prepare (no secrets, read-only): next 0.x version, `cargo package`, `cargo publish --dry-run`,
#                                    semver check against the last release, release notes preview,
#                                    SBOM from GitHub's dependency graph
#   draft   (environment `release`: the owner approves): a DRAFT GitHub Release at the prepared
#                                    commit, with notes generated from merged PRs, the .crate and
#                                    its SBOM; build provenance and the SBOM are attested to the .crate
#   publish (environment `crates-io`: the owner approves): starts only when the owner publishes the
#                                    draft (which creates the tag). Checks the tag is a prepared,
#                                    attested release, rebuilds the same package at the tag's commit,
#                                    and runs `cargo publish` with a short-lived crates.io token from
#                                    Trusted Publishing (GitHub OIDC); no long-lived token is stored.
#                                    See .github/factory/release.md (the owner's runbook).
#
# Versioning: the tag is the source of truth. Cargo.toml stays `0.0.0` with `publish = false` on main
# (so nothing can publish by accident); the package is stamped with the release version on the
# runner only. Major stays 0 while languages are incomplete (1.0 is an owner decision).
# Human tier: changes need the owner's review.
name: release

on:
  workflow_dispatch:
    inputs:
      level:
        description: "auto = minor if the public API broke or a language was added since the last release, else patch"
        type: choice
        options: [auto, patch, minor]
        default: auto
      dry_run:
        description: "Dry run: prepare only (no approval request, no draft)"
        type: boolean
        default: true
  # The owner publishing the draft release (which creates the tag) starts `publish`, which then waits
  # for the owner's approval of the `crates-io` environment. Releases published with the workflow
  # token don't trigger workflows, so only a person can start it.
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: factory-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'sabbasi3-factory-lab/chrono-node-rs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      # The dispatch's own commit (github.sha), not a moving `main`: build provenance names exactly
      # the commit the crate was built from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-semver-checks@0.51.0

      # Every locked dependency in the local registry before anything runs --offline (the first
      # release runs no semver check, so nothing else would fetch them on a cold cache).
      - name: Fetch locked dependencies
        run: cargo fetch --locked

      # A release ships only whole languages: no golden case may still be pending (a step it needs
      # unported), and every ported step matches chrono-node on every case (harness/golden/frontier.js).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: No pending golden case; every ported step matches chrono-node
        shell: bash -eo pipefail {0}
        env:
          TZ: UTC
        run: |
          cargo build --locked --bin chrono-rs-json
          cd harness && npm ci --ignore-scripts --no-audit --no-fund && npm run build:upstream
          node golden/frontier.js --rust ../target/debug/chrono-rs-json --complete --all | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Next version (0.x) and semver check against the last release
        id: version
        env:
          LEVEL: ${{ inputs.level }}
        run: bash .github/factory/release/next-version.sh

      # Stamp the version on the runner only (Cargo.toml + our own Cargo.lock entry), and drop
      # `publish = false` so cargo will verify the package as crates.io would. Nothing is committed.
      - name: Stamp ${{ steps.version.outputs.version }} (runner only)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/factory/release/stamp.sh

      - name: cargo package
        run: cargo package --locked --allow-dirty && ls -l target/package/*.crate

      - name: cargo publish --dry-run (no token; nothing is uploaded)
        run: cargo publish --dry-run --locked --allow-dirty

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREV: ${{ steps.version.outputs.previous }}
          WHY: ${{ steps.version.outputs.why }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          {
            echo "## Release ${VERSION} (prepared)"
            echo "- commit: \`${SHA}\`; previous release: ${PREV:-none}"
            echo "- level: ${WHY}"
            echo "- \`cargo package\` and \`cargo publish --dry-run\` passed; crates.io publishing starts only when the owner publishes the draft"
            echo
            echo "### Merged PRs since ${PREV:-the start}"
            git log --first-parent --format='- %s' ${PREV:+"${PREV}..${SHA}"} ${PREV:-"$SHA"} | head -300
          } >> "$GITHUB_STEP_SUMMARY"

      # SBOM from GitHub's own dependency graph (SPDX 2.3; built in, no third-party generator). It
      # covers the repository's manifests on main: the crate's Cargo.lock, and the harness's and the
      # vendored upstream's npm dev tooling (CI only, never shipped).
      # The graph is main's latest: it must match this commit's Cargo.lock exactly (every locked crate,
      # name@version, and no other cargo package), or no SBOM is attested.
      - name: SBOM (GitHub dependency graph, SPDX)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --jq .sbom > target/package/sbom.spdx.json
          jq -e '.spdxVersion and (.packages | length > 0)' target/package/sbom.spdx.json > /dev/null
          jq -r '[.packages[].externalRefs[]?.referenceLocator | select(startswith("pkg:cargo/")) | sub("^pkg:cargo/"; "")] | unique | .[]' target/package/sbom.spdx.json > "$RUNNER_TEMP/sbom-cargo.txt"
          git show "${SHA}:Cargo.lock" | awk '/^\[\[package\]\]/{n="";v=""} /^name = /{gsub(/"/,"",$3);n=$3} /^version = /{gsub(/"/,"",$3);v=$3; if (n != "" && n != "chrono-node-rs") print n"@"v}' | sort -u > "$RUNNER_TEMP/lock-cargo.txt"
          if ! diff -u "$RUNNER_TEMP/lock-cargo.txt" "$RUNNER_TEMP/sbom-cargo.txt"; then
            echo "::error::the dependency graph's cargo packages differ from Cargo.lock at ${SHA} (graph not indexed yet, or main moved): re-run later"; exit 1
          fi
          echo "SBOM: $(jq '.packages | length' target/package/sbom.spdx.json) packages; cargo packages match Cargo.lock at ${SHA}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate
          path: |
            target/package/*.crate
            target/package/sbom.spdx.json
          retention-days: 30

  # The owner's approval is the `release` environment's required reviewer. It creates a draft only:
  # publishing the draft (which creates the tag) is a second, manual owner step in the GitHub UI.
  draft:
    needs: prepare
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write       # artifact attestations (Sigstore), after the owner's approval only
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate
          path: crate

      # Build provenance (SLSA, GitHub artifact attestations) for the .crate, and the SBOM attested
      # to it. Verify with: gh attestation verify <file>.crate --repo sabbasi3-factory-lab/chrono-node-rs
      - name: The prepared commit is the run's commit
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: '[ "$SHA" = "$GITHUB_SHA" ] || { echo "::error::prepared ${SHA}, run is for ${GITHUB_SHA}: provenance would name another commit"; exit 1; }'

      - name: Attest build provenance (.crate)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: crate/*.crate

      - name: Attest the SBOM (.crate)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: crate/*.crate
          sbom-path: crate/sbom.spdx.json

      - name: Draft GitHub Release (notes from merged PRs, .github/release.yml)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          [[ "$VERSION" =~ ^0\.[0-9]+\.[0-9]+$ && "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad version or sha"; exit 1; }
          ! gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || { echo "::error::release v${VERSION} already exists (maybe as a draft)"; exit 1; }
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName -q '.[0].tagName // empty')
          gh release create "v${VERSION}" crate/*.crate crate/sbom.spdx.json --repo "$GITHUB_REPOSITORY" --draft --target "$SHA" \
            --title "v${VERSION}" --generate-notes ${prev:+--notes-start-tag "$prev"}

  # Starts when the owner publishes the draft (the `release` event), then waits for the owner's approval
  # of the `crates-io` environment (required reviewer; deployments only from `v0.*` tags). Fails closed
  # unless the tag is a release this workflow prepared: a v0.x.y tag on main whose release carries the
  # .crate the `draft` job attested, built from exactly the tag's commit, and identical in content to
  # the package rebuilt here. No cache: nothing from other runs reaches a job that can publish.
  publish:
    if: github.event_name == 'release' && github.repository == 'sabbasi3-factory-lab/chrono-node-rs'
    environment: crates-io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
      id-token: write       # crates.io Trusted Publishing (OIDC), after the owner's approval only
    env:
      TAG: ${{ github.event.release.tag_name }}
      # First publish only (crates.io can't trust a publisher for a crate that doesn't exist yet): a
      # one-time owner token in the `crates-io` environment. Afterwards it's deleted and OIDC is used.
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' && 'yes' || 'no' }}
    steps:
      - name: The tag is a v0.x.y release
        run: |
          [[ "$TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '${TAG}' isn't v0.x.y"; exit 1; }
          [ "$GITHUB_REF" = "refs/tags/${TAG}" ] || { echo "::error::ref ${GITHUB_REF} isn't refs/tags/${TAG}"; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad sha"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # The draft job's .crate, attested by this workflow on main for exactly the tag's commit.
      - name: The release carries the prepared, attested .crate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/released"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "chrono-node-rs-${VERSION}.crate" --dir "$RUNNER_TEMP/released" \
            || { echo "::error::release ${TAG} has no chrono-node-rs-${VERSION}.crate: not prepared by this workflow"; exit 1; }
          gh attestation verify "$RUNNER_TEMP/released/chrono-node-rs-${VERSION}.crate" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners \
            || { echo "::error::the .crate on ${TAG} isn't attested by release.yml on main for ${GITHUB_SHA}"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: The tag's commit is on main
        run: |
          [ "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$GITHUB_SHA" ] || { echo "::error::tag ${TAG} doesn't point at ${GITHUB_SHA}"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::${GITHUB_SHA} isn't on main"; exit 1; }

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Stamp ${{ env.VERSION }} (runner only)
        run: bash .github/factory/release/stamp.sh

      # Same commit and toolchain, so the same files; the archive bytes can differ (file times).
      - name: The rebuilt package matches the attested .crate
        run: |
          cargo package --locked --allow-dirty
          mkdir -p "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
          tar -xzf "$RUNNER_TEMP/released/chrono-node-rs-${VERSION}.crate" -C "$RUNNER_TEMP/a"
          tar -xzf "target/package/chrono-node-rs-${VERSION}.crate" -C "$RUNNER_TEMP/b"
          diff -r "$RUNNER_TEMP/a" "$RUNNER_TEMP/b" || { echo "::error::the rebuilt package differs from the attested .crate"; exit 1; }

      - name: crates.io token (Trusted Publishing, OIDC)
        id: auth
        if: env.HAS_TOKEN == 'no'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: cargo publish ${{ env.VERSION }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          [ "$HAS_TOKEN" = no ] || echo "::warning::published with the one-time CARGO_REGISTRY_TOKEN: delete it from the crates-io environment and use Trusted Publishing (release.md)"
          cargo publish --locked --allow-dirty
          {
            echo "## Published chrono-node-rs ${VERSION}"
            echo "- https://crates.io/crates/chrono-node-rs/${VERSION} (docs: https://docs.rs/chrono-node-rs/${VERSION})"
            echo "- commit \`${GITHUB_SHA}\`, tag \`${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
