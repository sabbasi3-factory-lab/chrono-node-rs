# Dependabot security alerts → the dependency steward, not Dependabot PRs. Plain code, no AI.
# Dependabot security updates stay off (Cargo.toml and Cargo.lock change only through the steward);
# alerts stay on. Daily, harness/security/alerts.js routes each open alert:
#   cargo                 → one `dependency-security` issue for the steward (needs-human until the
#                           steward can update a locked crate)
#   npm under upstream/   → the vendored chrono-node's dev tooling (CI-only judge): fixed by an
#                           upstream bump, so counted only
#   anything else         → one `dependency-security` issue for a person
# Kill switch: unless FACTORY_ENABLED is exactly "true", nothing is written.
# Human tier: changes need the owner's review.
name: security-alerts

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    if: github.repository == 'sabbasi3-factory-lab/chrono-node-rs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, issues: read, vulnerability-alerts: read }
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    outputs:
      issues: ${{ steps.plan.outputs.issues }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: harness

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Plan
        id: plan
        run: |
          mkdir -p /tmp/security
          gh api --paginate "repos/$R/dependabot/alerts?state=open&per_page=100" | jq -s 'add // []' > /tmp/security/alerts.json
          gh api --paginate "repos/$R/issues?labels=dependency-security&state=all&per_page=100" | jq -s 'add // [] | map({body})' > /tmp/security/issues.json
          node harness/security/alerts.js plan --alerts /tmp/security/alerts.json --issues /tmp/security/issues.json > /tmp/security/plan.json
          {
            echo "open alerts: $(jq length /tmp/security/alerts.json)"
            echo "routes: $(jq -c .summary /tmp/security/plan.json)"
            echo "new issues: $(jq '.issues | length' /tmp/security/plan.json)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "issues=$(jq '.issues | length' /tmp/security/plan.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-plan
          path: /tmp/security/plan.json
          retention-days: 7

  # Writes on a fresh runner: no install, only alerts.js (no third-party module) re-checking the plan.
  apply:
    needs: plan
    if: needs.plan.outputs.issues != '0' && vars.FACTORY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            harness/security
            harness/feedback

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-plan
          path: /tmp/security

      - name: Create controller App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.FACTORY_CONTROLLER_APP_ID }}
          private-key: ${{ secrets.FACTORY_CONTROLLER_PRIVATE_KEY }}
          owner: sabbasi3-factory-lab
          repositories: chrono-node-rs
          permission-issues: write

      - name: File the issues
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node harness/security/alerts.js apply --plan /tmp/security/plan.json
