# Starts the fire drills (drills.yml) about once a week at a random time, and always when the last
# passing drill run is more than 7 days old (factory policies/cadence.yaml: "weekly, at random
# times"). Plain code, no AI. It only dispatches `drills`; drill results are that workflow's runs
# (recorded in the audit log by the controller), so a slot that doesn't drill leaves no result.
# Human tier: changes need the owner's review.
name: drill-schedule

on:
  schedule:
    - cron: "37 1,7,13,19 * * *"   # 4 slots a day

permissions:
  contents: read

jobs:
  roll:
    if: github.repository == 'sabbasi3-factory-lab/chrono-node-rs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, actions: write }
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: harness/drills

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Roll, and dispatch the drills if this is the slot
        run: |
          last=$(gh api "repos/$R/actions/workflows/drills.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].created_at // ""' || echo "")
          active=$(gh api "repos/$R/actions/workflows/drills.yml/runs?per_page=5" --jq '[.workflow_runs[] | select(.status != "completed")] | length' || echo 1)
          decision=$(LAST="$last" node -e '
            const lib = require("./harness/drills/lib");
            const random = require("crypto").randomInt(0, 1_000_000) / 1_000_000;
            console.log(JSON.stringify(lib.shouldRun({ now: Date.now(), lastPassAt: process.env.LAST || null, random })));')
          echo "last passing drill run: ${last:-none}; in progress: $active; decision: $decision" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r .run <<<"$decision")" = "true" ] && [ "$active" = "0" ]; then
            gh workflow run drills.yml --repo "$R" --ref main
          fi
