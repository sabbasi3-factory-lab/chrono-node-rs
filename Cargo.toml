[package]
name = "chrono-node-rs"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Rust port of chrono-node: natural-language date parsing"
repository = "https://github.com/sabbasi3-factory-lab/chrono-node-rs"
publish = false
build = "build.rs"
exclude = ["upstream/", "harness/", "tests/golden/", "contracts/"]


[features]
# Factory drills only (drills/README.md): compiles the never-registered `factory_drill_*` step files,
# so CI's clippy, build and strict gates see them. Never a default: the product doesn't contain them.
# Removed with the drills.
factory-drill = []
[lib]
name = "chrono_node"

[dependencies]
fancy-regex = "0.19"
serde_json = "1"

[dev-dependencies]
# Strict gate perf_regression_max_pct (benches/golden_phrases.rs). Preapproved dev dependency
# (factory policies/dependencies.yaml); no default features (no plotting, no rayon).
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "golden_phrases"
harness = false
